name: Temporary current-site snapshot for UI geometry
on:
  push:
    branches: [codex/fix-hero-mac-header-and-copy-hitbox]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: hero-hitbox-site-snapshot
          path: |
            src/
            scripts/
            dist/
            package.json
            package-lock.json
          retention-days: 1
