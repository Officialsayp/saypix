name: Temporary copy hover build
on:
  push:
    branches: [codex/fix-mobile-copy-hover-state]
permissions:
  contents: write
jobs:
  build-and-commit-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-mobile-copy-hover-state
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          npm test
      - name: Commit generated dist on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate assets for mobile copy fix"
            git push origin HEAD:codex/fix-mobile-copy-hover-state
          fi
