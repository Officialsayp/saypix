name: Verify static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Verify generated files are committed
        run: git diff --exit-code -- dist

      - name: Verify strict RU/EN geometry and language curtain in Chrome
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/compact-ui-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-compact-density.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-stack-browser.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-hero-hitbox.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-curtain-lifecycle.mjs

  changes:
    name: Detect UI changes for WebKit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - 'src/**'
              - 'dist/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/verify.yml'

  webkit-copy:
    name: Verify copy and curtain lifecycle in WebKit (Safari engine)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # This pinned official image already has WebKit and its Linux dependencies.
      # Install only the JS package matching the image/browser revision.
      - name: Install Playwright JS package (browser preinstalled)
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Check hitbox, copy feedback and curtain lifecycle in WebKit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/copy-webkit-ci.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-hero-hitbox.mjs
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-curtain-lifecycle.mjs
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-stack-browser.mjs

  geometry-audit-chrome:
    name: Read-only geometry audit (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Audit all alignments at 24 widths (Chromium)
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/geometry-chrome.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/audit-geometry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-audit-chromium
          path: geometry-audit/
          if-no-files-found: warn

  geometry-audit-webkit:
    name: Read-only geometry audit (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Audit all alignments at 24 widths (WebKit)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/geometry-webkit.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/audit-geometry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-audit-webkit
          path: geometry-audit/
          if-no-files-found: warn
