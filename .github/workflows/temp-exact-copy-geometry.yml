name: Temporary exact-copy geometry validation
on:
  push:
    branches: [codex/redesign-copy-target-exact-geometry]
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-copy-target-exact-geometry
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build, test and check size budgets
        run: |
          npm ci
          npm test
      - name: Real-browser geometry, clipboard feedback and RU/EN curtain
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/copy-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-hero-hitbox.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-compact-density.mjs
      - name: Commit fingerprinted dist after successful tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: fingerprint exact-copy geometry assets"
            git push origin HEAD:codex/redesign-copy-target-exact-geometry
          fi
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-copy-target-exact-geometry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Install WebKit and native dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Safari-engine copy geometry and feedback
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/copy-webkit-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-hero-hitbox.mjs
