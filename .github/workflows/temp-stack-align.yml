name: Temporary Stack horizontal alignment validation
on:
  push:
    branches: [codex/align-stack-to-project-content]
permissions:
  contents: write
jobs:
  chrome-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/align-stack-to-project-content
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and static validations
        run: |
          npm ci
          npm test
      - name: Verify Stack x-alignment and original curtain in Chrome
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/stack-alignment-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-stack-browser.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-compact-density.mjs
      - name: Commit regenerated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: fingerprint stack alignment stylesheet"
            git push origin HEAD:codex/align-stack-to-project-content
          fi
  safari-webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/align-stack-to-project-content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and dependencies
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Validate Stack x-alignment in WebKit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/stack-webkit-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-stack-browser.mjs
