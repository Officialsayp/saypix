name: Temporary Compact B integration validation
on:
  push:
    branches: [codex/ship-compact-density-b]
permissions:
  contents: write
jobs:
  build-browser-and-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ship-compact-density-b
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate and build
        run: |
          npm ci
          npm test
      - name: Browser regression
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          command -v google-chrome
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/compact-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-compact-density.mjs
      - name: Commit rebuilt fingerprinted dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: fingerprint approved Compact B assets"
            git push origin HEAD:codex/ship-compact-density-b
          fi
