name: Temporary grouped Stack validation and build
on:
  push:
    branches: [codex/group-tech-stack-by-domain]
permissions:
  contents: write
jobs:
  chromium-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/group-tech-stack-by-domain
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build and test
        run: |
          npm ci
          npm test
      - name: Chrome geometry, curtain and stack regression
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/stack-http.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-stack-browser.mjs
          PLAYWRIGHT_MODULE=playwright-core BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/check-compact-density.mjs
      - name: Commit regenerated fingerprinted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: fingerprint grouped stack assets"
            git push origin HEAD:codex/group-tech-stack-by-domain
          fi
  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/group-tech-stack-by-domain
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Install matching JS package (WebKit already installed)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: WebKit Stack layout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/stack-webkit.log 2>&1 &
          sleep 2
          PLAYWRIGHT_MODULE=playwright BROWSER_ENGINE=webkit node scripts/check-stack-browser.mjs
