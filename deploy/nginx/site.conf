# Include inside each apex/origin content server {} after its root directive.
# Production root: /var/www/maxzolotoy/current. TLS/listeners belong to the host.
index index.html;
absolute_redirect off;
open_file_cache off;
charset utf-8;
gzip on;
# Vary is supplied by the map below; automatic gzip_vary would duplicate it.
gzip_vary off;
gzip_min_length 256;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# headers-more replaces values, including internal 416 error responses, without
# duplicating headers. Empty map results remove the corresponding field.
more_set_headers
    "X-Content-Type-Options: nosniff"
    "Referrer-Policy: strict-origin-when-cross-origin"
    "Permissions-Policy: camera=(), microphone=(), geolocation=()"
    "X-Frame-Options: DENY"
    "X-Robots-Tag: $max_robots"
    "Cache-Control: $max_cache"
    "Vary: $max_vary"
    "Allow: $max_allow";
# Range filtering can change status after the map was first evaluated.
more_clear_headers -s 416 Cache-Control;

# Four literal bytes: o, k, backslash, n. Preserve the existing Caddy response.
location = /_health { default_type text/plain; return 200 "ok\\n"; }
# Exact document locations avoid re-entering the /index.html redirect regex.
location = /ru/ { try_files /ru/index.html =404; }
location = /en/ { try_files /en/index.html =404; }
location = /_headers { return 404; }
location = /_redirects { return 404; }
location = / { return 302 /$max_language/$is_args$args; }
location ~ ^/(ru|en)(?:\.html|/index(?:\.html)?)?$ { return 308 /$1/$is_args$args; }
location / { try_files $uri $uri/ =404; }
