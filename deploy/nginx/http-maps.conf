# Include once inside http {}. Matches the reviewed 2026-10-30 VPS profile.
map $http_accept_language $max_language {
    default en;
    "~*^ru(?:-|,|;|$)" ru;
}

map "$status:$uri" $max_cache {
    default "public, max-age=0, must-revalidate";
    ~^416: "";
    ~^[0-9]+:/assets/ "public, max-age=31536000, immutable";
}

map "$status:$uri" $max_vary {
    default "";
    ~^200:/_health$ "";
    ~^(200|206|304|405|416): "Accept-Encoding";
}

map $status $max_allow {
    default "";
    405 "GET, HEAD";
}

map $host $max_robots {
    default "";
    origin.maxzolotoy.com "noindex, nofollow";
}
