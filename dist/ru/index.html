<!doctype html>
<html lang="ru" data-initial-lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <title>Максим Золотой — Go Backend Developer</title>
  <meta name="description" content="Персональный сайт Максима Золотого: Go backend, проекты, стек и контакты.">
  <link rel="canonical" href="https://maxzolotoy.com/ru/">
  <link rel="alternate" hreflang="ru" href="https://maxzolotoy.com/ru/">
  <link rel="alternate" hreflang="en" href="https://maxzolotoy.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://maxzolotoy.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <div class="language-ui" aria-label="Language switcher">
    <button class="language-edge language-edge--ru" type="button" data-lang-target="ru" aria-label="Русский язык">RU</button>
    <button class="language-edge language-edge--en" type="button" data-lang-target="en" aria-label="English language">EN</button>
    <div class="language-ghost" aria-hidden="true">EN</div>
    <div class="curtain-divider" aria-hidden="true"></div>
    <div class="drag-hint" aria-hidden="true">drag</div>
  </div>

  <div class="site-shell" id="site-shell">
    <div class="language-layer language-layer--ru" data-layer="ru"></div>
    <div class="language-reveal" data-reveal="en">
      <div class="language-layer language-layer--en" data-layer="en"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      JavaScript is required for the interactive language curtain. Use
      <a href="/ru/">RU</a> or <a href="/en/">EN</a>.
    </div>
  </noscript>

  <script type="module" src="/app.js"></script>
</body>
</html>
